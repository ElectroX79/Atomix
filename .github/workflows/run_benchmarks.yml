name: Run benchmarks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install GCC 16
        run: |
          sudo apt update
          sudo apt install -y gcc-16 g++-16

      - name: Check compiler
        run: |
          gcc-16 --version
          g++-16 --version


      - name: Run test script
      env:
        CC: gcc-16
        CXX: g++-16
      run: bash ./scripts/workflow/global_benchmark.sh

